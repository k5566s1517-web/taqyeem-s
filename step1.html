<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>العقار الأول - تقييم عقاري</title>
    
    <script src="cities.js"></script>
    <script src="districts.js"></script>
    <script src="data.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 400px; margin: 10px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; }
        .header { background: #1f3a5f; color: white; padding: 25px 20px; text-align: center; }
        .header h1 { font-size: 24px; margin-bottom: 8px; font-weight: 600; }
        .form-content { padding: 25px 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #34495e; font-weight: 600; font-size: 15px; }
        .required-star { color: #e74c3c; }
        input, select { width: 100%; padding: 15px 16px; border: 1.5px solid #dcdde1; border-radius: 12px; font-size: 16px; background-color: #fafafa; cursor: pointer; }
        input:focus, select:focus { outline: none; border-color: #1f3a5f; background-color: white; }
        
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        optgroup { font-weight: 900; color: #1f3a5f; background-color: #f0f2f5; font-size: 15px; padding: 10px 0 5px 0; border-top: 2px solid #cbd5e0; margin-top: 5px; }
        optgroup:first-of-type { border-top: none; }
        option { font-weight: normal; color: #1e293b; padding: 10px; background-color: white; }

        .fee-group { text-align: center; margin-top: 10px; }
        .fee-group label { text-align: center; font-size: 17px; color: #1f3a5f; }
        .fee-input { border: none !important; background: transparent !important; text-align: center !important; font-size: 34px !important; font-weight: 700 !important; color: #1e9e5a !important; padding: 6px 0 !important; width: 100%; direction: ltr !important; cursor: default; }
        .button-group { display: flex; gap: 12px; margin-top: 30px; }
        .btn { flex: 1; padding: 16px 0; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-primary { background: #1f3a5f; color: white; }
        .btn-prev { background: #95a5a6; color: white; }
        .period-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .period-row select { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>العقار الأول</h1>
        </div>
        
        <div class="form-content">
            <div class="form-group">
                <label>المدينة <span class="required-star">*</span></label>
                <select id="city" required onchange="loadDistricts()">
                    <option value="">جاري التحميل...</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>الحي <span class="required-star">*</span></label>
                <select id="district" required>
                    <option value="">اختر المدينة أولاً</option>
                </select>
            </div>

            <div class="form-group">
                <label>نوع العقار <span class="required-star">*</span></label>
                <select id="propertyType" required onchange="calculateFee()">
                    <option value="">جاري التحميل...</option>
                </select>
            </div>

            <div class="form-group">
                <label>مساحة الأرض (م²) <span class="required-star">*</span></label>
                <input type="text" id="area" placeholder="مثال: 500" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, ''); calculateFee();" onwheel="this.blur()">
            </div>

            <!-- حقل نوع الطلب -->
            <div class="form-group">
                <label>نوع الطلب <span class="required-star">*</span></label>
                <select id="requestType" required onchange="calculateFee()">
                    <option value="">اختر نوع الطلب</option>
                    <option value="تقييم ارض وبناء وإيجار">تقييم ارض وبناء وإيجار</option>
                    <option value="تقييم ارض وبناء">تقييم ارض وبناء</option>
                    <option value="تقييم ارض">تقييم ارض</option>
                    <option value="تقييم بناء">تقييم بناء</option>
                    <option value="تقييم إيجار">تقييم إيجار</option>
                    <option value="دراسة استثمار">دراسة استثمار</option>
                </select>
            </div>

            <div class="form-group">
                <label>الفترة الزمنية <span class="required-star">*</span></label>
                <select id="periodType" required onchange="togglePeriodInputs(); calculateFee()">
                    <option value="">اختر الفترة</option>
                    <option value="لسنة الحالية">لسنة الحالية</option>
                    <option value="تقييم لسنة">تقييم لسنة</option>
                    <option value="تقييم بالمثل">تقييم بالمثل</option>
                </select>
                
                <div id="singleYearBox" class="period-row" style="display:none;">
                    <select id="singleYear" onchange="calculateFee()"><option value="">اختر السنة</option></select>
                </div>
                
                <div id="rangeYearBox" class="period-row" style="display:none;">
                    <select id="fromYear" onchange="calculateFee()"><option value="">من سنة</option></select>
                    <span>إلى</span>
                    <select id="toYear" onchange="calculateFee()"><option value="">إلى سنة</option></select>
                </div>
            </div>

            <div class="form-group fee-group">
                <label>الأتعاب</label>
                <input type="text" id="fee" class="fee-input" readonly placeholder="0">
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="saveAndGoToSummary()">حفظ ومتابعة</button>
                <button class="btn btn-prev" onclick="window.location.href='step0.html'">السابق</button>
            </div>
        </div>
    </div>

    <script>
        const citiesList = typeof saudiCities !== 'undefined' ? saudiCities : [];
        const districtsList = typeof districtsData !== 'undefined' ? districtsData : {};

        window.onload = function() {
            const citySelect = document.getElementById('city');
            citySelect.innerHTML = '<option value="">اختر المدينة</option>';
            citiesList.forEach(c => citySelect.innerHTML += `<option value="${c}">${c}</option>`);

            const propSelect = document.getElementById('propertyType');
            propSelect.innerHTML = '<option value="">اختر نوع العقار</option>';
            if(typeof propertyTypes !== 'undefined') {
                propertyTypes.forEach(group => {
                    const optGroup = document.createElement('optgroup');
                    optGroup.label = group.group;
                    group.options.forEach(option => {
                        optGroup.innerHTML += `<option value="${option}">${option}</option>`;
                    });
                    propSelect.appendChild(optGroup);
                });
            }

            const single = document.getElementById('singleYear');
            const from = document.getElementById('fromYear');
            const to = document.getElementById('toYear');
            for(let y = 2030; y >= 1990; y--) {
                single.innerHTML += `<option value="${y}">${y}</option>`;
                from.innerHTML += `<option value="${y}">${y}</option>`;
                to.innerHTML += `<option value="${y}">${y}</option>`;
            }
        };

        function loadDistricts() {
            const city = document.getElementById('city').value;
            const select = document.getElementById('district');
            select.innerHTML = '<option value="">اختر الحي</option>';
            if(districtsList[city]) {
                districtsList[city].forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);
            }
        }

        function togglePeriodInputs() {
            const type = document.getElementById('periodType').value;
            document.getElementById('singleYearBox').style.display = 'none';
            document.getElementById('rangeYearBox').style.display = 'none';
            if(type === 'تقييم لسنة') document.getElementById('singleYearBox').style.display = 'flex';
            if(type === 'تقييم بالمثل') document.getElementById('rangeYearBox').style.display = 'flex';
        }

        function calculateFee() {
            const pType = document.getElementById('propertyType').value;
            const rType = document.getElementById('requestType').value;
            const area = parseFloat(document.getElementById('area').value) || 0;
            const periodType = document.getElementById('periodType').value;
            const singleYear = document.getElementById('singleYear').value;
            const fromYear = document.getElementById('fromYear').value;
            const toYear = document.getElementById('toYear').value;

            if(!pType || !rType || !area || !periodType) {
                document.getElementById('fee').value = '';
                return;
            }

            // حساب الأتعاب (المعادلة المبسطة)
            let baseP = 1500;
            if (pType.includes('فيلا')) baseP = 2500;
            if (pType.includes('قصر')) baseP = 8000;
            if (pType.includes('شقة')) baseP = 2000;

            let reqF = 1.0;
            if (rType === 'تقييم ارض') reqF = 0.7;
            if (rType.includes('دراسة') || rType.includes('تحليل')) reqF = 1.5;

            let areaF = 1.0;
            if (area > 500 && area <= 1000) areaF = 1.2;
            else if (area > 1000) areaF = 1.5;

            let perF = 1.0;
            const currentYear = new Date().getFullYear();
            if (periodType === 'تقييم لسنة' && singleYear) {
                const yearsBack = currentYear - parseInt(singleYear);
                if (yearsBack > 0) perF = Math.min(1.0 + (yearsBack * 0.1), 3.0);
            } else if (periodType === 'تقييم بالمثل' && fromYear && toYear) {
                const oldest = Math.min(parseInt(fromYear), parseInt(toYear));
                const yearsBack = currentYear - oldest;
                const yearsCount = Math.abs(parseInt(toYear) - parseInt(fromYear)) + 1;
                perF = Math.min(1.0 + (yearsBack * 0.1) + ((yearsCount - 1) * 0.1), 3.0);
            }

            const fee = Math.round(baseP * reqF * areaF * perF);
            document.getElementById('fee').value = fee + ' ريال';
        }

        // دالة الحفظ والانتقال إلى صفحة الكشف
        function saveAndGoToSummary() {
            const city = document.getElementById('city').value;
            const district = document.getElementById('district').value;
            const propertyType = document.getElementById('propertyType').value;
            const area = document.getElementById('area').value;
            const requestType = document.getElementById('requestType').value;
            const periodType = document.getElementById('periodType').value;
            const fee = document.getElementById('fee').value;

            if(!city || !district || !propertyType || !area || !requestType || !periodType) {
                alert('الرجاء تعبئة جميع الحقول المطلوبة');
                return;
            }

            // جلب رقم العقار الحالي (إذا كان موجوداً، وإلا فهو العقار الأول)
            let currentPropIndex = parseInt(localStorage.getItem('currentPropertyIndex')) || 1;
            
            // حفظ بيانات العقار الحالي
            const propertyData = {
                city: city,
                district: district,
                propertyType: propertyType,
                area: area,
                requestType: requestType,
                periodType: periodType,
                periodText: periodType === 'تقييم لسنة' ? 'سنة ' + document.getElementById('singleYear').value : 
                            periodType === 'تقييم بالمثل' ? 'من ' + document.getElementById('fromYear').value + ' إلى ' + document.getElementById('toYear').value : 
                            'لسنة الحالية',
                fee: fee
            };
            
            localStorage.setItem(`property${currentPropIndex}`, JSON.stringify(propertyData));
            
            // تحديث عدد العقارات في requestData
            let requestData = JSON.parse(localStorage.getItem('requestData')) || { propertyCount: 1 };
            if(currentPropIndex > requestData.propertyCount) {
                requestData.propertyCount = currentPropIndex;
                localStorage.setItem('requestData', JSON.stringify(requestData));
            }

            // الانتقال إلى صفحة الكشف
            window.location.href = 'step2.html';
        }
    </script>
</body>
</html>
